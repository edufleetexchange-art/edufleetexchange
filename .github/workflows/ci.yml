name: CI

# Quality gate — runs on every push and PR to the trunk + environment branches.
# No secrets needed: the test suite uses an in-memory MongoDB (mongodb-memory-server).
on:
  pull_request:
    branches: [main, dev, stage, prod]
  push:
    branches: [main, dev, stage, prod]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Tests (in-memory MongoDB)
        run: npm test
